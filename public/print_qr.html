<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimal Birthday QR - Priya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFDF9;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 297mm;
      width: 210mm;
      color: #4A3E42;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      position: relative;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .date {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #A3858D;
      font-weight: 500;
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 400;
      color: #D38B9C;
      margin: 0 0 12px 0;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 14px;
      color: #7A696E;
      font-weight: 400;
      margin-bottom: 45px;
      letter-spacing: 0.2px;
    }

    .qr-frame {
      background: #FFFFFF;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(211, 139, 156, 0.12);
      border: 1px solid #F4E8EB;
      margin-bottom: 40px;
      display: inline-block;
    }

    .qr-frame img {
      width: 220px;
      height: 220px;
      display: block;
      border-radius: 8px;
    }

    .footer-note {
      font-size: 13px;
      color: #A3858D;
      font-weight: 400;
    }

    .heart {
      color: #D38B9C;
      margin-top: 20px;
      font-size: 14px;
    }

    .print-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #D38B9C;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(211, 139, 156, 0.3);
      transition: transform 0.2s;
    }
    .print-btn:hover {
      transform: scale(1.04);
    }

    @media print {
      .print-btn {
        display: none;
      }
    }
  </style>
</head>
<body>

  <button class="print-btn" onclick="window.print()">🖨️ Print Minimal A4</button>

  <div class="container">
    <div class="date">For Priya • 2026</div>
    <h1>Happy Birthday</h1>
    <div class="tagline">Scan with your camera to open your surprise</div>

    <div class="qr-frame">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=https://priyabirthday.vercel.app&color=d38b9c&bgcolor=ffffff&format=png" alt="Priya Birthday QR Code">
    </div>

    <div class="footer-note">priyabirthday.vercel.app</div>
    <div class="heart">❤️</div>
  </div>

</body>
</html>
