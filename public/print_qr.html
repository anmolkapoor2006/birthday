<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday Priya - Printable QR Code Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    @page {
      size: A4 portrait;
      margin: 0;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFDF9;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-h: 100vh;
      height: 297mm;
      width: 210mm;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      color: #7A5B63;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* Ambient Floral Background Shapes */
    .bg-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(255, 227, 232, 0.8) 0%, rgba(255, 253, 249, 0) 70%);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }

    .card-border {
      position: absolute;
      inset: 15mm;
      border: 2px dashed #E08BA6;
      border-radius: 24px;
      pointer-events: none;
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .subtitle {
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #C5A059;
      font-weight: 600;
      margin-bottom: 15px;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 64px;
      color: #D38B9C;
      margin: 0 0 10px 0;
      line-height: 1.1;
    }

    .tagline {
      font-size: 16px;
      color: #6B555B;
      margin-bottom: 35px;
      font-weight: 500;
    }

    .qr-container {
      background: #FFFFFF;
      padding: 25px;
      border-radius: 28px;
      box-shadow: 0 15px 40px rgba(211, 139, 156, 0.2);
      border: 1px solid #FFE3E8;
      display: inline-block;
      margin-bottom: 30px;
    }

    .qr-container img {
      width: 240px;
      height: 240px;
      display: block;
    }

    .instructions {
      font-size: 14px;
      color: #8C6F77;
      max-width: 320px;
      line-height: 1.6;
    }

    .heart-icon {
      color: #E08BA6;
      font-size: 20px;
      margin-top: 15px;
    }

    .print-btn {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #D38B9C;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(211, 139, 156, 0.4);
      z-index: 100;
    }

    @media print {
      .print-btn {
        display: none;
      }
    }
  </style>
</head>
<body>

  <button className="print-btn" onclick="window.print()">🖨️ Print A4 Card</button>

  <div className="bg-glow"></div>
  <div className="card-border"></div>

  <div className="content">
    <div className="subtitle">Written With Love • 2026</div>
    <h1>Happy Birthday Priya!</h1>
    <div className="tagline">Scan with your camera to open your surprise website ✨</div>

    <div className="qr-container">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=1000x1000&data=https://priyabirthday.vercel.app&color=d38b9c&bgcolor=ffffff&format=png" alt="Priya Birthday Website QR Code">
    </div>

    <div className="instructions">
      Point your phone's camera at the code above to begin your birthday journey ❤️
    </div>

    <div className="heart-icon">🌸 💖 🌸</div>
  </div>

</body>
</html>
